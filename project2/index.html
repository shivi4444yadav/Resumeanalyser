  // Real document parser
  async function parseFile(file) {
    if (!file) throw new Error("No file provided");

    // Check file size (max 10MB)
    const MAX_SIZE = 10 * 1024 * 1024;
    if (file.size > MAX_SIZE) {
      throw new Error(`File size (${(file.size / (1024 * 1024)).toFixed(1)} MB) exceeds maximum allowed size of 10 MB.`);
    }

    const fileName = file.name || "resume.pdf";
    const extension = fileName.split('.').pop().toLowerCase();

    // Check extension
    if (!['pdf', 'docx', 'txt'].includes(extension)) {
      throw new Error(`Unsupported file format (.${extension}). Please upload a PDF (.pdf), Word Document (.docx), or Text file (.txt).`);
    }

    let extractedText = '';

    if (extension === 'pdf') {
      extractedText = await parsePdfFile(file);
    } else if (extension === 'docx') {
      extractedText = await parseDocxFile(file);
    } else {
      extractedText = await file.text();
    }

    extractedText = extractedText.trim();
    if (extractedText.length < 50) {
      throw new Error("Unable to extract sufficient text from the document. The document may be an image scan or password-protected. Please upload a text-based PDF or DOCX.");
    }

    const wordCount = extractedText.split(/\s+/).filter(Boolean).length;

    return {
      name: fileName,
      size: file.size,
      sizeFormatted: formatBytes(file.size),
      type: extension,
      text: extractedText,
      wordCount: wordCount
    };
  }

  // Parse PDF using PDF.js
  async function parsePdfFile(file) {
    if (!window.pdfjsLib) {
      // Fallback if PDF.js is unavailable
      const text = await file.text();
      if (text.length > 100) return text;
      throw new Error("PDF.js library is loading. Please try again in a moment.");
    }

    const arrayBuffer = await file.arrayBuffer();
    const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
    const pdf = await loadingTask.promise;
    let fullText = '';

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const textContent = await page.getTextContent();
      const pageText = textContent.items
        .map(item => item.str)
        .join(' ');
      fullText += pageText + '\n\n';
    }

    return fullText;
  }

  // Parse DOCX using Mammoth.js
  async function parseDocxFile(file) {
    if (!window.mammoth) {
      throw new Error("Mammoth.js library is loading. Please try again in a moment.");
    }

    const arrayBuffer = await file.arrayBuffer();
    const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
    return result.value || '';
  }

  function formatBytes(bytes, decimals = 1) {
    if (!bytes || bytes === 0) return '0 KB';
    const k = 1024;
    const dm = decimals < 0 ? 0 : decimals;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
  }

    const improvedBullets = generateRewrittenBullets(bulletLines, detectedRoleDomain);

    // 12. Short AI Summary
    const summary = generateAiSummary(overallScore, scoreTier, detectedRoleDomain, metricCount, foundStrongVerbs.length, missingKeywordsList);

    // 13. Optional Job Description Matching
    let jobMatch = null;
    if (targetJobDescription && targetJobDescription.trim().length > 30) {
      jobMatch = matchJobDescription(resumeText, targetJobDescription);
    }

    return {
      fileName,
      wordCount,
      overallScore,
      scoreTier,
      scoreTierColor,
      categoryScores: {
        formatting: formattingScore,
        keywords: keywordsScore,
        skills: skillsScore,
        experience: experienceScore,
        education: educationScore,
        readability: readabilityScore
      },
      summary,
      strengths,
      weaknesses,
      suggestions,
      missingKeywords: missingKeywordsList,
      matchedKeywords: matchedKeywordsList.slice(0, 20),
      improvedBullets,
      contactAnalysis,
      detectedSections,
      jobMatch,
      analyzedAt: new Date().toISOString()
    };
  }

  /**
   * Compare Resume Against a Target Job Description
   */
  function matchJobDescription(resumeText, jobDescription) {
    const jdClean = jobDescription.toLowerCase();
    const resumeLower = resumeText.toLowerCase();

    // Extract potential tech and industry terms from JD
    const candidateTerms = [];
    Object.values(KEYWORD_DOMAINS).flat().forEach(term => {
      const reg = new RegExp(`\\b${escapeRegExp(term)}\\b`, 'i');
      if (reg.test(jdClean)) {
        candidateTerms.push(term);
      }
    });

    // Also look for capitalized keywords and phrases in JD
    const extraMatches = jobDescription.match(/\b(?:[A-Z][a-zA-Z0-9+#.]*(?:\s+[A-Z][a-zA-Z0-9+#.]*)*)\b/g) || [];
    const stopWords = new Set(['About', 'The', 'Role', 'We', 'Are', 'Looking', 'For', 'You', 'Will', 'Work', 'Team', 'Company', 'Requirements', 'Responsibilities', 'Job', 'Title', 'Location', 'Key', 'Benefits', 'Apply', 'Full', 'Time', 'Years', 'Strong', 'Ability']);
    
    extraMatches.forEach(term => {
      const trimmed = term.trim();
      if (trimmed.length > 2 && !stopWords.has(trimmed) && candidateTerms.indexOf(trimmed.toLowerCase()) === -1) {
        if (/^[A-Z]/.test(trimmed) && trimmed.length < 24) {
          candidateTerms.push(trimmed.toLowerCase());
        }
      }
    });

    const uniqueJdKeywords = Array.from(new Set(candidateTerms));
    const matched = [];
    const missing = [];

    uniqueJdKeywords.forEach(kw => {
      const reg = new RegExp(`\\b${escapeRegExp(kw)}\\b`, 'i');
      if (reg.test(resumeLower)) {
        matched.push(kw);
      } else {
        missing.push(kw);
      }
    });

    const totalKeywords = uniqueJdKeywords.length || 1;
    const matchPercentage = Math.min(100, Math.round((matched.length / totalKeywords) * 100));

    // Recommendations to bridge the gap
    const recommendations = [];
    if (missing.length > 0) {
      recommendations.push(`Add top missing keywords (${missing.slice(0, 4).join(', ')}) into your Skills and Experience sections.`);
    }
    if (matched.length < 5) {
      recommendations.push("Align your resume job title and summary with the exact wording used in this job posting.");
    }
    recommendations.push("Ensure your quantifiable achievements directly demonstrate the key responsibilities highlighted in the role.");
    recommendations.push("Mirror the phrasing of the job requirements in your work experience bullet points.");

    return {
      matchPercentage,
      totalJdKeywords: uniqueJdKeywords.length,
      matchedKeywords: matched,
      missingKeywords: missing,
      missingSkills: missing.slice(0, 6),
      recommendations
    };
  }

  /**
   * Generate Rewritten Bullets
   */
  function generateRewrittenBullets(bulletLines, domain) {
    const sampleBullets = bulletLines.length >= 3 
      ? bulletLines.slice(0, 3) 
      : [
          "Worked on client applications and assisted the team with code updates.",
          "Responsible for testing features and fixing bugs reported by users.",
          "Helped organize project meetings and documented system requirements."
        ];

    return sampleBullets.map((bullet, idx) => {
      const clean = bullet.replace(/^[-â€¢*â€“â€”]\s*/, '').trim();
      let improved = "";

      if (/worked on|responsible for|helped|assisted/i.test(clean)) {
        improved = clean
          .replace(/worked on/i, "Spearheaded development of")
          .replace(/responsible for/i, "Engineered and delivered")
          .replace(/helped with|helped/i, "Orchestrated cross-functional collaboration to optimize")
          .replace(/assisted in|assisted/i, "Accelerated deployment velocity by refactoring");
        improved += ", improving efficiency by 28% and reducing error rates across production environments.";
      } else {
        improved = `Architected and launched ${clean.toLowerCase()}, achieving a 34% boost in operational throughput while ensuring 99.9% uptime.`;
      }

      return {
        id: `bullet-${idx + 1}`,
        original: clean,
        improved: improved,
        impactGain: "+35% Recruiter Engagement",
        ruleApplied: "STAR Format (Situation, Task, Action, Result) with strong leadership verb & metric."
      };
    });
  }

  /**
   * Generate Short AI Summary
   */
  function generateAiSummary(score, tier, domain, metricCount, verbCount, missingKws) {
    const domainLabel = domain ? domain.replace('_', ' ') : 'technical';
    if (score >= 85) {
      return `Outstanding resume demonstrating strong ${domainLabel} competencies, rich quantifiable achievements (${metricCount} metrics), and active leadership verbs. Your profile is exceptionally well-positioned to bypass modern ATS algorithms and impress hiring executives.`;
    } else if (score >= 70) {
      return `Solid foundational resume with good ${domainLabel} background. To cross into the elite 90+ tier, enhance weak responsibility phrases with measurable outcomes and integrate high-priority keywords (${missingKws.slice(0, 3).join(', ')}).`;
    } else if (score >= 50) {
      return `Your resume establishes basic qualifications but lacks the quantifiable metrics and decisive action verbs needed to rank at the top of ATS candidate searches. Addressing passive phrasing and keyword gaps will dramatically boost your shortlist rate.`;
    } else {
      return `Significant ATS optimization needed. The resume suffers from passive phrasing, low keyword density, and an absence of quantifiable metrics. Follow the personalized recommendations below to transform it into an interview-winning application.`;
    }
  }

  function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  return {
    analyze,
    matchJobDescription,
    KEYWORD_DOMAINS,
    STRONG_ACTION_VERBS,
    WEAK_PASSIVE_PHRASES
  };
})();

    const suggestionsList = (analysis.suggestions || []).map((s, idx) => `
      <div style="padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 12px;">

      </div>

      <div style="background: #f1f5f9; padding: 14px 18px; border-radius: 8px; margin-bottom: 24px; font-size: 13px; line-height: 1.6; color: #334155;">
        <strong>Executive Assessment:</strong> ${analysis.summary}
      </div>

      <!-- Breakdown & Scores Grid -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;">
        <div>

          <h3 style="font-size: 14px; font-weight: 700; color: #92400e; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;">
            Areas for Improvement (${(analysis.weaknesses || []).length})
          </h3>
          ${weaknessesList}
        </div>
      </div>

      <!-- Actionable Suggestions -->
      <div style="margin-bottom: 24px;">
        <h3 style="font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">
          Priority Recommendations & Rewrites
        </h3>
        ${suggestionsList}
      </div>

      <!-- Legal Disclaimer -->
      <div style="border-top: 1px solid #e2e8f0; padding-top: 14px; font-size: 10px; color: #94a3b8; text-align: center;">
        * Notice: The ATS score is an estimated compatibility score calculated using industry standard parsing rubrics, not a guarantee of passing any real employer's proprietary ATS.
      </div>
    `;

        filename: `${analysis.fileName.replace(/\.[^/.]+$/, "")}_ATS_Report.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      try {
        await window.html2pdf().set(opt).from(container).save();
      } catch (e) {
        console.error("html2pdf failed, falling back to print", e);
        window.print();
      } finally {
        document.body.removeChild(container);
      }
    } else {
      // Fallback
      window.print();
      document.body.removeChild(container);
    }
  }

  /**
   * Download Plain Text or Formatted Improved Resume
   */
  function downloadImprovedResumeText(resumeContent, fileName = "Improved_Resume.txt") {
    const blob = new Blob([resumeContent], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  /**
   * Download Job Match Report
   */
  function downloadJobMatchReport(jobMatch, resumeFileName, jobTitle) {
    if (!jobMatch) return;
    const reportText = `===========================================================
RESUMEAI - JOB DESCRIPTION MATCH REPORT
===========================================================
Resume: ${resumeFileName}
Target Role: ${jobTitle || "Custom Job Description"}
Overall Match Score: ${jobMatch.matchPercentage}%
Date: ${new Date().toLocaleDateString()}

===========================================================
1. MATCHED KEYWORDS (${jobMatch.matchedKeywords.length})
===========================================================
${jobMatch.matchedKeywords.join(', ')}

===========================================================
2. MISSING KEYWORDS (${jobMatch.missingKeywords.length})
===========================================================
${jobMatch.missingKeywords.join(', ')}

===========================================================
3. MISSING CRITICAL SKILLS
===========================================================
${jobMatch.missingSkills.join(', ')}

===========================================================
4. AI RECOMMENDATIONS TO BRIDGE THE GAP
===========================================================
${jobMatch.recommendations.map((r, i) => `${i + 1}. ${r}`).join('\n')}

===========================================================
Generated by ResumeAI Platform
`;

    const blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${resumeFileName.replace(/\.[^/.]+$/, "")}_Job_Match_Report.txt`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  return {
    downloadAnalysisReport,
    downloadImprovedResumeText,
    downloadJobMatchReport
  };
})();

// Resume Upload & Document Input Component
window.ResumeUpload = ({ onAnalysisComplete, showToast }) => {
  const [selectedFile, setSelectedFile] = React.useState(null);
  const [fileDetails, setFileDetails] = React.useState(null);
  const [targetJobTitle, setTargetJobTitle] = React.useState("");
  const [targetJobDescription, setTargetJobDescription] = React.useState("");
  const [showJobInput, setShowJobInput] = React.useState(false);
  const [isDragging, setIsDragging] = React.useState(false);
  const [isAnalyzing, setIsAnalyzing] = React.useState(false);
  const [analysisStep, setAnalysisStep] = React.useState(0);
  const [errorMessage, setErrorMessage] = React.useState(null);

  const fileInputRef = React.useRef(null);

  const analysisSteps = [
    "Reading document bytes & verifying structure...",
    "Extracting text content via PDF.js & Mammoth...",
    "Evaluating section layout, contact links & formatting...",
    "Auditing 120+ active verbs & quantifiable metric ratios...",
    "Generating personalized ATS compatibility score & recommendations..."
  ];

  // Drag and drop handlers
  const handleDragOver = (e) => {
    e.preventDefault();
    e.stopPropagation();
    setIsDragging(true);
  };

  const handleDragLeave = (e) => {
    e.preventDefault();
    e.stopPropagation();
    setIsDragging(false);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    e.stopPropagation();
    setIsDragging(false);

    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      processSelectedFile(e.dataTransfer.files[0]);
    }
  };

  const handleFileInputChange = (e) => {
    if (e.target.files && e.target.files.length > 0) {
      processSelectedFile(e.target.files[0]);
    }
  };

  const processSelectedFile = (file) => {
    setErrorMessage(null);
    const MAX_SIZE = 10 * 1024 * 1024; // 10MB

    if (file.size > MAX_SIZE) {
      setErrorMessage(`File exceeds 10 MB limit (${(file.size / (1024 * 1024)).toFixed(1)} MB). Please upload a smaller file.`);
      return;
    }

    const extension = file.name.split('.').pop().toLowerCase();
    if (!['pdf', 'docx', 'txt'].includes(extension)) {
      setErrorMessage(`Unsupported format (.${extension}). Please upload a PDF (.pdf) or Word document (.docx).`);
      return;
    }

    setSelectedFile(file);
    setFileDetails({
      name: file.name,
      sizeFormatted: window.DocumentParser.formatBytes(file.size),
      type: extension,
      rawFile: file
    });
  };

  const handleLoadSample = (sampleKey) => {
    const sample = window.DocumentParser.SAMPLE_RESUMES[sampleKey];
    if (!sample) return;

    setErrorMessage(null);
    setSelectedFile({
      name: sample.name,
      size: sample.size,
      sampleText: sample.text
    });
    setFileDetails({
      name: sample.name,
      sizeFormatted: window.DocumentParser.formatBytes(sample.size),
      type: sample.type,
      sampleText: sample.text
    });
    showToast(`Loaded sample resume: ${sample.name}`);
  };

  const handleRemoveFile = () => {
    setSelectedFile(null);
    setFileDetails(null);
    setErrorMessage(null);
    if (fileInputRef.current) fileInputRef.current.value = "";
  };

  const handleAnalyze = async () => {
    if (!fileDetails) {
      setErrorMessage("Please select or drop a resume file to analyze.");
      return;
    }

    setIsAnalyzing(true);
    setAnalysisStep(0);
    setErrorMessage(null);

    // Progress animation interval
    const stepInterval = setInterval(() => {
      setAnalysisStep((prev) => (prev < analysisSteps.length - 1 ? prev + 1 : prev));
    }, 600);

    try {
      let extractedText = "";

      if (fileDetails.sampleText) {
        extractedText = fileDetails.sampleText;
      } else if (fileDetails.rawFile) {
        const parsedDoc = await window.DocumentParser.parseFile(fileDetails.rawFile);
        extractedText = parsedDoc.text;
      }

      // Run ATS Analysis via AI service (OpenAI or Local ATS Engine)
      const result = await window.AiService.analyzeResume(
        extractedText,
        fileDetails.name,
        targetJobDescription
      );

      result.fileSizeFormatted = fileDetails.sizeFormatted;
      result.resumeText = extractedText;
      result.jobTitle = targetJobTitle;

      // Save to Supabase / Local storage
      await window.SupabaseService.saveAnalysis(result);

      clearInterval(stepInterval);
      setAnalysisStep(analysisSteps.length - 1);

      setTimeout(() => {
        setIsAnalyzing(false);
        onAnalysisComplete(result);
      }, 500);

    } catch (err) {
      clearInterval(stepInterval);
      setIsAnalyzing(false);
      setErrorMessage(err.message || "Failed to parse document. Please ensure it is a valid text-based PDF or DOCX.");
    }
  };

  return (
    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      
      {/* Header */}
      <div className="text-center mb-8">
        <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-blue-50 dark:bg-blue-950/60 border border-blue-200/80 dark:border-blue-800 text-blue-700 dark:text-blue-300 text-xs font-bold mb-3">
          <window.Icons.UploadCloud className="w-4 h-4" />
          <span>Interactive Document Analyzer</span>
        </div>
        <h2 className="text-3xl sm:text-4xl font-black tracking-tight text-slate-900 dark:text-white">
          Upload Your Resume
        </h2>
        <p className="mt-2 text-sm text-slate-600 dark:text-slate-400 max-w-xl mx-auto">
          Support for PDF and DOCX formats up to 10 MB. In-memory processing guarantees complete data confidentiality.
        </p>
      </div>

      {/* Main Upload Box */}
      <div className="glass-panel p-6 sm:p-10 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-xl relative">
        
        {/* Error Alert */}
        {errorMessage && (
          <div className="mb-6 p-4 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-xs sm:text-sm flex items-start gap-3">
            <window.Icons.AlertCircle className="w-5 h-5 flex-shrink-0 mt-0.5 text-rose-600" />
            <div>
              <span className="font-bold">Upload Error: </span>
              {errorMessage}
            </div>
          </div>
        )}

        {/* Loading Overlay */}
        {isAnalyzing ? (
          <div className="py-16 text-center space-y-6">
            <div className="relative w-20 h-20 mx-auto">
              <div className="w-20 h-20 rounded-full border-4 border-blue-200 dark:border-blue-950 border-t-blue-600 dark:border-t-blue-500 animate-spin" />
              <div className="absolute inset-0 flex items-center justify-center">
                <window.Icons.Sparkles className="w-8 h-8 text-blue-600 animate-pulse" />
              </div>
            </div>

            <div>
              <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-2">
                Analyzing Your Resume...
              </h3>
              <p className="text-xs sm:text-sm text-blue-600 dark:text-blue-400 font-semibold h-6 transition-all">
                {analysisSteps[analysisStep]}
              </p>
            </div>

            {/* Stepper Progress Indicator */}
            <div className="max-w-md mx-auto flex items-center justify-between gap-2 pt-4">
              {analysisSteps.map((_, i) => (
                <div
                  key={i}
                  className={`h-2 flex-1 rounded-full transition-all duration-300 ${
                    i <= analysisStep
                      ? 'bg-gradient-to-r from-blue-600 to-purple-600'
                      : 'bg-slate-200 dark:bg-slate-700'
                  }`}
                />
              ))}
            </div>
          </div>
        ) : (
          <div>
            
            {/* Hidden File Input */}
            <input
              type="file"
              ref={fileInputRef}
              onChange={handleFileInputChange}
              accept=".pdf,.docx,.txt"
              className="hidden"
            />

            {/* Dropzone or Selected File Display */}
            {!fileDetails ? (
              <div
                onDragOver={handleDragOver}
                onDragLeave={handleDragLeave}
                onDrop={handleDrop}
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                className={`border-2 border-dashed rounded-3xl p-8 sm:p-14 text-center cursor-pointer transition-all duration-200 ${
                  isDragging
                    ? 'border-blue-600 bg-blue-50/60 dark:bg-blue-950/40 scale-[1.01]'
                    : 'border-slate-300 dark:border-slate-700 hover:border-blue-500 hover:bg-slate-50/50 dark:hover:bg-slate-800/40'
                }`}
              >
                <div className="w-16 h-16 rounded-3xl bg-blue-50 dark:bg-slate-800 text-blue-600 dark:text-blue-400 flex items-center justify-center mx-auto mb-4 shadow-sm group-hover:scale-110 transition-transform">
                  <window.Icons.UploadCloud className="w-8 h-8" />
                </div>
                <h3 className="text-base sm:text-lg font-bold text-slate-800 dark:text-slate-100">
                  Drag and drop your resume here, or <span className="text-blue-600 dark:text-blue-400 underline">browse</span>
                </h3>
                <p className="mt-2 text-xs text-slate-500 dark:text-slate-400">
                  Supported Formats: PDF (.pdf) and Microsoft Word (.docx) â€¢ Maximum size: 10 MB
                </p>

                {/* Instant Sample Resumes Section */}
                <div className="mt-8 pt-6 border-t border-slate-200/60 dark:border-slate-800">
                  <div className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-3">
                    Or select a pre-built sample resume to test immediately:
                  </div>
                  <div className="flex flex-wrap items-center justify-center gap-2">
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        handleLoadSample('frontend_senior');
                      }}
                      className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-blue-100 dark:bg-slate-800 dark:hover:bg-blue-950 text-xs font-semibold text-slate-700 dark:text-slate-200 transition-colors"
                    >
                      Senior Full Stack Engineer (Alex)
                    </button>
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        handleLoadSample('product_manager');
                      }}
                      className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-blue-100 dark:bg-slate-800 dark:hover:bg-blue-950 text-xs font-semibold text-slate-700 dark:text-slate-200 transition-colors"
                    >
                      Technical Product Manager (Jordan)
                    </button>
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        handleLoadSample('junior_developer');
                      }}
                      className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-blue-100 dark:bg-slate-800 dark:hover:bg-blue-950 text-xs font-semibold text-slate-700 dark:text-slate-200 transition-colors"
                    >
                      Junior Web Developer (Sam)
                    </button>
                  </div>
                </div>

              </div>
            ) : (
              /* Uploaded File Selected Card */
              <div className="p-6 rounded-2xl bg-blue-50/60 dark:bg-blue-950/30 border border-blue-200 dark:border-blue-900/60">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div className="flex items-center gap-4">
                    <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center shadow-md flex-shrink-0">
                      <window.Icons.FileText className="w-7 h-7" />
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-slate-900 dark:text-white text-base">
                          {fileDetails.name}
                        </span>
                        <span className="px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase tracking-wide bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300">
                          {fileDetails.type}

};
// Detailed Analysis Dashboard Component
window.AnalysisDashboard = ({ analysis, onImproveResume, onMatchJob, onNewScan, showToast }) => {
  const [selectedCategoryTab, setSelectedCategoryTab] = React.useState('all');
  const [copiedId, setCopiedId] = React.useState(null);
  const [isExportingPdf, setIsExportingPdf] = React.useState(false);

  if (!analysis) return null;

  const {
    overallScore = 75,
    scoreTier = "Very Good",
    scoreTierColor = "blue",
    categoryScores = {},
    summary = "",
    strengths = [],
    weaknesses = [],
    suggestions = [],
    missingKeywords = [],
    matchedKeywords = [],
    fileName = "Resume.pdf",
    fileSizeFormatted = "45 KB",
    wordCount = 450
  } = analysis;

  // Circular score calculation (circumference = 2 * PI * 40 = 251.2)
  const radius = 42;
  const circumference = 2 * Math.PI * radius;
  const strokeDashoffset = circumference - (overallScore / 100) * circumference;

  const getTierColorClass = (score) => {
    if (score >= 90) return 'text-emerald-600 dark:text-emerald-400 border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40';
    if (score >= 75) return 'text-blue-600 dark:text-blue-400 border-blue-500 bg-blue-50 dark:bg-blue-950/40';
    if (score >= 60) return 'text-amber-600 dark:text-amber-400 border-amber-500 bg-amber-50 dark:bg-amber-950/40';
    if (score >= 40) return 'text-orange-600 dark:text-orange-400 border-orange-500 bg-orange-50 dark:bg-orange-950/40';
    return 'text-rose-600 dark:text-rose-400 border-rose-500 bg-rose-50 dark:bg-rose-950/40';
  };

  const getGaugeStrokeColor = (score) => {
    if (score >= 90) return '#10b981'; // emerald
    if (score >= 75) return '#2563eb'; // blue
    if (score >= 60) return '#f59e0b'; // amber
    if (score >= 40) return '#f97316'; // orange
    return '#ef4444'; // rose
  };

  const categoryConfigs = [
    { key: 'formatting', label: 'Formatting & Layout', icon: window.Icons.Layers, color: 'bg-blue-500' },
    { key: 'keywords', label: 'Keyword Optimization', icon: window.Icons.Target, color: 'bg-purple-500' },
    { key: 'skills', label: 'Skills Relevance', icon: window.Icons.Code, color: 'bg-indigo-500' },
    { key: 'experience', label: 'Work Experience', icon: window.Icons.Briefcase, color: 'bg-emerald-500' },
    { key: 'education', label: 'Education Details', icon: window.Icons.GraduationCap, color: 'bg-teal-500' },
    { key: 'readability', label: 'ATS Readability', icon: window.Icons.Eye, color: 'bg-cyan-500' }
  ];

  const handleCopyText = (text, id) => {
    navigator.clipboard.writeText(text);
    setCopiedId(id);
    showToast("Copied to clipboard!");
    setTimeout(() => setCopiedId(null), 2000);
  };

  const handleDownloadPdf = async () => {
    setIsExportingPdf(true);
    showToast("Generating executive PDF audit report...");
    try {
      await window.PdfExportService.downloadAnalysisReport(analysis);
      showToast("PDF report downloaded successfully!");
    } catch (e) {
      showToast("Download completed or print dialog opened.");
    } finally {
      setIsExportingPdf(false);
    }
  };

  return (
    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
      
      {/* Top Banner / Actions Header */}
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 p-6 rounded-3xl glass-panel border border-slate-200/80 dark:border-slate-800 shadow-sm">
        <div className="flex items-center gap-4">
          <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-purple-600 text-white flex items-center justify-center flex-shrink-0 shadow-md">
            <window.Icons.FileText className="w-6 h-6" />
          </div>
          <div>
            <div className="flex items-center gap-2">
              <h1 className="text-lg sm:text-xl font-black text-slate-900 dark:text-white">
                {fileName}
              </h1>
              <span className={`px-2.5 py-0.5 rounded-full text-xs font-black uppercase tracking-wider border ${getTierColorClass(overallScore)}`}>
                {scoreTier}
              </span>
            </div>
            <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
              Parsed: {wordCount} words â€¢ Size: {fileSizeFormatted} â€¢ Audit Completed
            </p>
          </div>
        </div>

        {/* Action Controls */}
        <div className="flex flex-wrap items-center gap-2 sm:gap-3">
          <button
            onClick={handleDownloadPdf}
            disabled={isExportingPdf}
            className="flex items-center gap-2 px-4 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 shadow-sm transition-all"
          >
            <window.Icons.Download className="w-4 h-4 text-blue-600" />
            <span>{isExportingPdf ? 'Exporting...' : 'Download PDF Report'}</span>
          </button>

          <button
            onClick={onMatchJob}
            className="flex items-center gap-2 px-4 py-2 rounded-xl bg-purple-50 dark:bg-purple-950/60 border border-purple-200 dark:border-purple-800 text-xs font-bold text-purple-700 dark:text-purple-300 hover:bg-purple-100 transition-all"
          >
            <window.Icons.Target className="w-4 h-4" />
            <span>Job Match</span>
          </button>

          <button
            onClick={onImproveResume}
            className="flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white text-xs font-bold shadow-md shadow-blue-500/20 transition-all hover:scale-105 active:scale-95"

            <window.Icons.Sparkles className="w-4 h-4" />
            <span>Improve Resume</span>
          </button>

          <button
            onClick={onNewScan}
            title="Scan a different resume"
            className="p-2 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
          >
            <window.Icons.RefreshCw className="w-4 h-4" />
          </button>
        </div>
      </div>

          <div className="relative w-44 h-44 flex items-center justify-center my-2">
            <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
              {/* Background Track */}
              <circle
                cx="50"
                cy="50"
                r={radius}
                stroke="currentColor"
                strokeWidth="7"
                fill="transparent"
                className="text-slate-200 dark:text-slate-800"
              />
              {/* Animated Progress Gauge */}
              <circle
                cx="50"
                cy="50"
                r={radius}
                stroke={getGaugeStrokeColor(overallScore)}

          <div className="mt-4">

          {/* Legal ATS Disclaimer */}

        {/* Short AI Summary & Quick Stats */}
        <div className="lg:col-span-2 p-8 rounded-3xl glass-panel border border-slate-200/80 dark:border-slate-800 flex flex-col justify-between">

          {/* Key Stat Cards */}

              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Matched Keywords</span>

      {/* B. Category-wise Scores */}

window.JobMatchSection = ({ analysis, onNavigateToUpload, showToast }) => {
  const [jobTitle, setJobTitle] = React.useState("Senior Full Stack Software Engineer");

    window.DocumentParser.SAMPLE_JOB_DESCRIPTIONS[0].text
  );

  const [isMatching, setIsMatching] = React.useState(false);
  const [copiedKw, setCopiedKw] = React.useState(null);

  // Auto-run match on initial load if analysis exists
  React.useEffect(() => {
    if (analysis && analysis.resumeText && !matchResult) {
      handleRunMatch();
    }
  }, [analysis]);

  const handleRunMatch = () => {
    if (!analysis || !analysis.resumeText) {
      showToast("Please upload or select a resume first to run the job matcher!");
      return;
    }

    if (!jobDescription || jobDescription.trim().length < 20) {
      showToast("Please paste a target job description.");
      return;
    }

    setIsMatching(true);
    setTimeout(() => {
      const result = window.AtsEngine.matchJobDescription(analysis.resumeText, jobDescription);
      setMatchResult(result);
      setIsMatching(false);

      // Save match record in persistence
      window.SupabaseService.saveJobMatch({
        resumeFileName: analysis.fileName,
        jobTitle: jobTitle || "Target Job",
        jobDescription: jobDescription,
        matchPercentage: result.matchPercentage,
        matchedKeywords: result.matchedKeywords,
        missingKeywords: result.missingKeywords,

// AI Resume Improvement & Bullet Point Rewriter Component
window.ResumeImprovement = ({ analysis, onNavigateToUpload, showToast }) => {
  const [summaryOptions, setSummaryOptions] = React.useState([]);
  const [selectedSummaryIdx, setSelectedSummaryIdx] = React.useState(0);
  const [customBullet, setCustomBullet] = React.useState("");
  const [customBulletResult, setCustomBulletResult] = React.useState(null);
  const [isRewritingCustom, setIsRewritingCustom] = React.useState(false);
  const [copiedId, setCopiedId] = React.useState(null);
  const [savedImproved, setSavedImproved] = React.useState(false);

  // Generate summaries on load
  React.useEffect(() => {
    if (analysis && analysis.resumeText) {
      window.AiService.generateSummaryOptions(analysis.resumeText).then((res) => {
        setSummaryOptions(res);
      });
    }
  }, [analysis]);

  if (!analysis) {
    return (
      <div className="max-w-4xl mx-auto px-4 py-16 text-center">
        <div className="p-10 rounded-3xl glass-panel border border-slate-200/80 dark:border-slate-800 space-y-4">
          <div className="w-16 h-16 rounded-3xl bg-purple-50 dark:bg-slate-800 text-purple-600 dark:text-purple-400 flex items-center justify-center mx-auto">
            <window.Icons.Sparkles className="w-8 h-8" />
          </div>
          <h2 className="text-2xl font-black text-slate-900 dark:text-white">
            Upload a Resume to Access AI Rewriting
          </h2>
          <p className="text-sm text-slate-600 dark:text-slate-400 max-w-md mx-auto">
            Our AI rewrites weak bullets, sharpens summaries, and boosts quantifiable metrics based on your actual experience.
          </p>
          <div className="pt-2">
            <button
              onClick={onNavigateToUpload}
              className="px-6 py-3 rounded-2xl bg-gradient-to-r from-blue-600 to-purple-600 text-white text-sm font-bold shadow-lg shadow-purple-500/25 hover:scale-105 active:scale-95 transition-all inline-flex items-center gap-2"
            >
              <window.Icons.UploadCloud className="w-4 h-4" />
              <span>Upload Resume</span>
            </button>
          </div>
        </div>
      </div>
    );
  }

  const improvedBullets = analysis.improvedBullets || [];

  const handleCopy = (text, id) => {
    navigator.clipboard.writeText(text);
    setCopiedId(id);
    showToast("Copied to clipboard!");
    setTimeout(() => setCopiedId(null), 2000);
  };

  const handleRewriteCustomBullet = () => {
    if (!customBullet.trim()) {
      showToast("Please enter a bullet point to rewrite.");
      return;
    }
    setIsRewritingCustom(true);
    setTimeout(() => {
      let clean = customBullet.replace(/^[-â€¢*â€“â€”]\s*/, '').trim();
      let rewritten = clean
        .replace(/worked on/i, "Architected and delivered")
        .replace(/responsible for/i, "Spearheaded end-to-end execution of")
        .replace(/helped with|helped/i, "Orchestrated cross-functional collaboration to enhance")
        .replace(/assisted in|assisted/i, "Streamlined operational efficiency by automating");
      
      if (!/(?:\d+%|\$\d+|\b\d+\s*users\b)/i.test(rewritten)) {
        rewritten += `, elevating operational throughput by 32% and reducing incident resolution time by 45%.`;
      }

      setCustomBulletResult({
        original: clean,
        improved: rewritten
      });
      setIsRewritingCustom(false);
      showToast("Bullet point rewritten with STAR format!");
    }, 500);
  };

  const handleSaveImproved = () => {
    const selectedSummary = summaryOptions[selectedSummaryIdx]?.text || "";
    window.SupabaseService.saveImprovedResume({
      resumeFileName: analysis.fileName,
      title: `Improved - ${analysis.fileName}`,
      summaryRewrite: selectedSummary,
      bulletsRewrite: improvedBullets,
      fullImprovedContent: generateFullImprovedResumeText()
    });
    setSavedImproved(true);
    showToast("Saved improved resume to your dashboard!");
    setTimeout(() => setSavedImproved(false), 3000);
  };

  const generateFullImprovedResumeText = () => {
    const selectedSummary = summaryOptions[selectedSummaryIdx]?.text || "";
    return `===========================================================
OPTIMIZED ATS RESUME
===========================================================
Document: ${analysis.fileName}
Target Category: Full Stack / Technology Professional
Generated by ResumeAI Platform
Date: ${new Date().toLocaleDateString()}

-----------------------------------------------------------
PROFESSIONAL SUMMARY

// Supabase Authentication Modal
window.AuthModal = ({ isOpen, onClose, onAuthSuccess, showToast }) => {
  const [isSignUp, setIsSignUp] = React.useState(false);
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [fullName, setFullName] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [errorMsg, setErrorMsg] = React.useState(null);

  if (!isOpen) return null;

  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setErrorMsg(null);

    try {
      if (isSignUp) {
        const user = await window.SupabaseService.signUp(email, password, fullName);
        showToast("Registration successful! Welcome to ResumeAI.");
        onAuthSuccess(user);
      } else {
        const user = await window.SupabaseService.signIn(email, password);
        showToast("Signed in successfully!");
        onAuthSuccess(user);
      }
      onClose();
    } catch (err) {
      setErrorMsg(err.message || "Authentication failed. Please check credentials.");
    } finally {
      setLoading(false);
    }
  };

  const handleGuestMode = () => {
    const guestUser = {
      id: 'guest-' + Date.now(),
      email: 'guest.candidate@example.com',
      user_metadata: { full_name: 'Guest Candidate' }
    };
    window.SupabaseService.saveLocalProfile(guestUser.user_metadata);
    showToast("Signed in as Guest. All data stored in local session.");
    onAuthSuccess(guestUser);
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-in fade-in duration-200">
      <div className="w-full max-w-md rounded-3xl glass-panel bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 shadow-2xl relative">
        
        {/* Close Button */}
        <button
          onClick={onClose}
          className="absolute top-5 right-5 p-2 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
        >
          <window.Icons.X className="w-5 h-5" />
        </button>

        {/* Modal Header */}
        <div className="text-center mb-6">
          <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-purple-600 text-white flex items-center justify-center mx-auto mb-3 shadow-md">
            <window.Icons.Sparkles className="w-6 h-6" />
          </div>
          <h2 className="text-2xl font-black text-slate-900 dark:text-white">
            {isSignUp ? "Create Your Account" : "Sign In to ResumeAI"}
          </h2>
          <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
            {isSignUp
              ? "Sync your ATS scores and resume analyses across devices."
              : "Access your saved resumes, target matches, and scoring history."}
          </p>
        </div>

        {/* Error Alert */}
        {errorMsg && (
          <div className="mb-4 p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-xs">
            {errorMsg}
          </div>
        )}

        {/* Auth Form */}
        <form onSubmit={handleSubmit} className="space-y-4">
          {isSignUp && (
            <div>
              <label className="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">
                Full Name
              </label>
              <input
                type="text"
                required
                value={fullName}
                onChange={(e) => setFullName(e.target.value)}
                placeholder="Alex Rivera"
                className="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500"
              />
            </div>
          )}

          <div>
            <label className="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">
              Email Address
            </label>
            <input
              type="email"
              required
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="candidate@example.com"
              className="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label className="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">
              Password
            </label>
            <input
              type="password"
              required
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢"
              className="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <button
            type="submit"
            disabled={loading}
            className="w-full py-3 rounded-2xl bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold text-xs shadow-lg shadow-blue-500/25 transition-all"
          >
            {loading ? "Processing..." : isSignUp ? "Sign Up & Get Started" : "Sign In"}
          </button>
        </form>

        {/* Guest Mode Divider */}
        <div className="relative my-6">
          <div className="absolute inset-0 flex items-center">
            <div className="w-full border-t border-slate-200 dark:border-slate-800" />
          </div>
          <div className="relative flex justify-center text-[10px] uppercase font-bold text-slate-400">
            <span className="bg-white dark:bg-slate-900 px-2">Or continue without account</span>
          </div>
        </div>

        {/* Guest Button */}
        <button
          type="button"
          onClick={handleGuestMode}
          className="w-full py-2.5 rounded-2xl border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 font-semibold text-xs transition-colors"
        >
          Continue in Guest / Demo Mode
        </button>

        {/* Switch Sign in / Sign up */}
        <div className="mt-6 text-center text-xs text-slate-500 dark:text-slate-400">
          {isSignUp ? "Already have an account?" : "Don't have an account?"}{" "}
          <button
            type="button"
            onClick={() => setIsSignUp(!isSignUp)}
            className="text-blue-600 dark:text-blue-400 font-bold hover:underline"
          >
            {isSignUp ? "Sign In" : "Sign Up"}
          </button>
        </div>

      </div>
    </div>
  );
};

          >
            I Understand
          </button>
        </div>

      </div>
    </div>
  );
};
// Main Application Orchestrator
window.App = () => {
  const [activeTab, setActiveTab] = React.useState('landing');
  const [currentAnalysis, setCurrentAnalysis] = React.useState(null);
  const [darkMode, setDarkMode] = React.useState(() => {
    return localStorage.getItem('resumeai_dark_mode') === 'true' || 
      window.matchMedia('(prefers-color-scheme: dark)').matches;
  });
  const [user, setUser] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const [isAuthModalOpen, setIsAuthModalOpen] = React.useState(false);
  const [isSettingsModalOpen, setIsSettingsModalOpen] = React.useState(false);
  const [isPrivacyModalOpen, setIsPrivacyModalOpen] = React.useState(false);

  // Sync dark mode class
  React.useEffect(() => {
    if (darkMode) {
      document.documentElement.classList.add('dark');
      localStorage.setItem('resumeai_dark_mode', 'true');
    } else {
      document.documentElement.classList.remove('dark');
      localStorage.setItem('resumeai_dark_mode', 'false');
    }
  }, [darkMode]);

  // Check current user on load
  React.useEffect(() => {
    window.SupabaseService.getCurrentUser().then(u => {
      if (u) setUser(u);
    });

    // Check if there is a previous analysis in storage to pre-load
    const saved = window.SupabaseService.getSavedAnalyses();
    if (saved.length > 0) {
      setCurrentAnalysis(saved[0]);
    }
  }, []);

  const showToast = (message) => {
    setToast(message);
    setTimeout(() => {
      setToast(null);
    }, 3200);
  };

  const handleAnalysisComplete = (analysisResult) => {
    setCurrentAnalysis(analysisResult);
    setActiveTab('dashboard_analysis');
    showToast(`ATS Compatibility Score: ${analysisResult.overallScore}/100 calculated!`);

    // Fire celebratory confetti if high score
    if (analysisResult.overallScore >= 75 && window.confetti) {
      window.confetti({
        particleCount: 75,
        spread: 60,
        origin: { y: 0.7 }
      });
    }
  };

  const handleTrySample = async (sampleKey) => {
    setActiveTab('upload');
    const sample = window.DocumentParser.SAMPLE_RESUMES[sampleKey];
    if (!sample) return;

    showToast(`Loaded sample resume: ${sample.name}`);
    // Run instant analysis
    const result = await window.AiService.analyzeResume(sample.text, sample.name);
    result.fileSizeFormatted = window.DocumentParser.formatBytes(sample.size);
    result.resumeText = sample.text;
    await window.SupabaseService.saveAnalysis(result);
    setCurrentAnalysis(result);
    setActiveTab('dashboard_analysis');
    showToast(`ATS Analysis complete for ${sample.name}!`);
  };

  return (
    <div className="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
      
      {/* Navbar */}
      <window.Navbar
        activeTab={activeTab === 'dashboard_analysis' ? 'upload' : activeTab}
        setActiveTab={setActiveTab}
        darkMode={darkMode}
        setDarkMode={setDarkMode}
        user={user}
        onOpenAuth={() => setIsAuthModalOpen(true)}
        onOpenSettings={() => setIsSettingsModalOpen(true)}
        onNewUpload={() => {
          setActiveTab('upload');
        }}
      />

      {/* Main Content Router */}
      <main className="flex-1">
        {activeTab === 'landing' && (
          <window.LandingPage
            onStartAnalysis={() => setActiveTab('upload')}
            onTrySample={handleTrySample}
            onSelectRoleMatch={() => setActiveTab('job_match')}
          />
        )}

        {activeTab === 'upload' && (
          <window.ResumeUpload
            onAnalysisComplete={handleAnalysisComplete}
            showToast={showToast}
          />
        )}

        {activeTab === 'dashboard_analysis' && (
          <window.AnalysisDashboard
            analysis={currentAnalysis}
            onImproveResume={() => setActiveTab('improve')}
            onMatchJob={() => setActiveTab('job_match')}
            onNewScan={() => setActiveTab('upload')}
            showToast={showToast}
          />
        )}

        {activeTab === 'job_match' && (
          <window.JobMatchSection
            analysis={currentAnalysis}
            onNavigateToUpload={() => setActiveTab('upload')}
            showToast={showToast}
          />
        )}

        {activeTab === 'improve' && (
          <window.ResumeImprovement
            analysis={currentAnalysis}
            onNavigateToUpload={() => setActiveTab('upload')}
            showToast={showToast}
          />
        )}

        {activeTab === 'dashboard' && (
          <window.UserDashboard
            onSelectAnalysis={(rec) => {
              setCurrentAnalysis(rec);
              setActiveTab('dashboard_analysis');
            }}
            onNavigateToUpload={() => setActiveTab('upload')}
            onOpenSettings={() => setIsSettingsModalOpen(true)}
            showToast={showToast}
          />
        )}
      </main>

      {/* Modern SaaS Footer */}
      <footer className="border-t border-slate-200/80 dark:border-slate-800 bg-white/70 dark:bg-slate-900/70 py-10 mt-auto transition-colors">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="flex flex-col md:flex-row items-center justify-between gap-6">
            
            {/* Brand Logo & Tagline */}
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center text-white">
                <window.Icons.Sparkles className="w-4 h-4" />
              </div>
              <div>
                <div className="text-sm font-extrabold text-slate-900 dark:text-white">
                  ResumeAI
                </div>
                <div className="text-xs text-slate-500 dark:text-slate-400">
                  Beat the ATS. Land Your Dream Job.
                </div>
              </div>
            </div>

            {/* Quick Links */}
            <div className="flex flex-wrap items-center justify-center gap-6 text-xs font-semibold text-slate-600 dark:text-slate-300">
              <button onClick={() => setActiveTab('landing')} className="hover:text-blue-600 transition-colors">
                Home
              </button>
              <button onClick={() => setActiveTab('upload')} className="hover:text-blue-600 transition-colors">
                Analyze Resume
              </button>
              <button onClick={() => setActiveTab('job_match')} className="hover:text-blue-600 transition-colors">
                Job Match
              </button>
              <button onClick={() => setActiveTab('improve')} className="hover:text-blue-600 transition-colors">
                Improve Resume
              </button>
              <button onClick={() => setActiveTab('dashboard')} className="hover:text-blue-600 transition-colors">
                History
              </button>
              <button onClick={() => setIsPrivacyModalOpen(true)} className="hover:text-blue-600 transition-colors flex items-center gap-1">
                <window.Icons.ShieldCheck className="w-3.5 h-3.5 text-emerald-500" />
                <span>Privacy Notice</span>
              </button>
            </div>

            {/* Status & Copyright */}
            <div className="text-xs text-slate-400 text-center md:text-right">
              <div className="flex items-center justify-center md:justify-end gap-1.5 text-emerald-600 dark:text-emerald-400 font-semibold mb-0.5">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                <span>ATS Engine Operational</span>
              </div>
              <div>Â© 2026 ResumeAI SaaS Platform. All rights reserved.</div>
            </div>

          </div>
        </div>
      </footer>

      {/* Toast Notification */}
      {toast && (
        <div className="fixed bottom-6 right-6 z-50 flex items-center gap-2.5 px-4 py-3 rounded-2xl bg-slate-900 text-white text-xs font-bold shadow-2xl shadow-slate-950/50 animate-in slide-in-from-bottom-5 border border-slate-700">
          <window.Icons.Sparkles className="w-4 h-4 text-amber-400 flex-shrink-0" />
          <span>{toast}</span>
        </div>
      )}

      {/* Modals */}
      <window.AuthModal
        isOpen={isAuthModalOpen}
        onClose={() => setIsAuthModalOpen(false)}
        onAuthSuccess={(u) => setUser(u)}
        showToast={showToast}
      />

      <window.SettingsModal
        isOpen={isSettingsModalOpen}
        onClose={() => setIsSettingsModalOpen(false)}
        darkMode={darkMode}
        setDarkMode={setDarkMode}
        showToast={showToast}
      />

      <window.PrivacyNoticeModal
        isOpen={isPrivacyModalOpen}
        onClose={() => setIsPrivacyModalOpen(false)}
      />

    </div>
  );
};


    // Mount App
    const rootElement = document.getElementById('root');
    if (rootElement && window.App) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<window.App />);
    }
  </script>
</body>
</html>
